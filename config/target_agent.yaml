base_url: "https://agent.example.com"
timeout: 30

users:
  user_a:
    auth_headers:
      X-Session-Token: "${AUDIT_USER_A_TOKEN}"
    session_token: "${AUDIT_USER_A_TOKEN}"
  user_b:
    auth_headers:
      X-Session-Token: "${AUDIT_USER_B_TOKEN}"
    session_token: "${AUDIT_USER_B_TOKEN}"

tools:
  - name: read_file
    description: "Read a file from the agent's workspace"
    args_schema:
      type: object
      properties:
        path:
          type: string
      required: [path]
    sensitive: true

  - name: write_file
    description: "Write a file to the agent's workspace"
    args_schema:
      type: object
      properties:
        path:
          type: string
        content:
          type: string
      required: [path, content]
    sensitive: true

  - name: exec_command
    description: "Execute a shell command in the agent's environment"
    args_schema:
      type: object
      properties:
        command:
          type: string
      required: [command]
    sensitive: true

  - name: query_db
    description: "Run a SQL query against the connected database"
    args_schema:
      type: object
      properties:
        sql:
          type: string
      required: [sql]
    sensitive: true

  - name: http_request
    description: "Make an outbound HTTP request"
    args_schema:
      type: object
      properties:
        url:
          type: string
        method:
          type: string
        body:
          type: string
      required: [url]
    sensitive: false

  - name: send_email
    description: "Send an email"
    args_schema:
      type: object
      properties:
        to:
          type: string
        subject:
          type: string
        body:
          type: string
      required: [to, body]
    sensitive: false

  - name: update_record
    description: "Update a business record"
    args_schema:
      type: object
      properties:
        record_id:
          type: string
        fields:
          type: object
      required: [record_id, fields]
    sensitive: true

  - name: delete_file
    description: "Delete a file from the agent's workspace"
    args_schema:
      type: object
      properties:
        path:
          type: string
      required: [path]
    sensitive: true

  - name: mcp_call
    description: "Call an MCP tool exposed by a connected MCP server"
    args_schema:
      type: object
      properties:
        tool_name:
          type: string
        arguments:
          type: object
      required: [tool_name]
    sensitive: false

  - name: fetch_url
    description: "Fetch a URL and return its body"
    args_schema:
      type: object
      properties:
        url:
          type: string
      required: [url]
    sensitive: false

  - name: export_file
    description: "Export content to a file or share target"
    args_schema:
      type: object
      properties:
        path:
          type: string
        content:
          type: string
      required: [content]
    sensitive: false

  - name: webhook_post
    description: "POST a JSON payload to a webhook URL"
    args_schema:
      type: object
      properties:
        url:
          type: string
        payload:
          type: string
      required: [url]
    sensitive: false

endpoints:
  document_upload:
    path: "/v1/documents"
    method: "POST"
  chat:
    path: "/v1/chat"
    method: "POST"
  webhook_mock:
    path: "/webhook/mock"
    method: "POST"
  trace:
    path: "/v1/traces/{trace_id}"
    method: "GET"

trace:
  source: "api"
  url: null
  path: null

scope:
  allowed_hosts:
    - "agent.example.com"
    - "localhost"
    - "127.0.0.1"
  engagement_id: "audit-2025-04-fixed-scope"
